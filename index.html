<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Coco Travel 当前行程入口。" />
  <meta name="theme-color" content="#0076c9" />
  <title>Coco Travel</title>
  <link rel="icon" href="./assets/favicon.ico" sizes="any" />
  <link rel="icon" href="./assets/coco-travel-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <style>
    :root {
      --bg: #f5f9fb;
      --surface: #fbfefd;
      --surface-strong: #edf6fa;
      --text: #20303a;
      --muted: #60717b;
      --line: #d7e5eb;
      --accent: #0076c9;
      --accent-strong: #005891;
      --warm: #f28c18;
      --shadow: 0 18px 46px rgba(21, 57, 77, .12);
      --radius: 18px;
      color-scheme: light dark;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a20;
        --surface: #17242b;
        --surface-strong: #1f313b;
        --text: #edf7fb;
        --muted: #afc2cb;
        --line: #2a424e;
        --accent: #5db9f3;
        --accent-strong: #94d4ff;
        --warm: #ffb257;
        --shadow: 0 18px 46px rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    ::selection {
      color: #f7fbfd;
      background: var(--accent-strong);
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--warm) 72%, transparent);
      outline-offset: 4px;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 28rem),
        radial-gradient(circle at 94% 6%, color-mix(in srgb, var(--warm) 18%, transparent), transparent 22rem),
        linear-gradient(180deg, var(--bg), var(--surface-strong));
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: 0;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: min(100%, 720px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) clamp(16px, 5vw, 32px) max(28px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(42px, 10vh, 96px);
    }

    .topbar {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 860;
    }

    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .home {
      align-self: start;
      display: grid;
      gap: 14px;
    }

    .label {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 780;
    }

    .trip-link {
      position: relative;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 17px 16px 18px;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--surface) 94%, transparent), color-mix(in srgb, var(--surface) 78%, transparent)),
        linear-gradient(90deg, var(--accent), var(--warm));
      box-shadow: var(--shadow);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .trip-link::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      border-radius: var(--radius) 0 0 var(--radius);
      background: linear-gradient(180deg, var(--accent), var(--warm));
    }

    .trip-link:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 34%, var(--line));
      box-shadow: 0 22px 54px rgba(21, 57, 77, .16);
    }

    .trip-link:active {
      transform: scale(.985);
    }

    .trip-name {
      min-width: 0;
      padding-left: 4px;
      font-size: clamp(1.42rem, 8vw, 2.55rem);
      line-height: 1.05;
      font-weight: 920;
      letter-spacing: 0;
    }

    .arrow {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #f7fbfd;
      background: var(--accent-strong);
      font-size: 1.4rem;
      line-height: 1;
    }

    @media (max-width: 430px) {
      body { font-size: 15px; }

      .page {
        padding-left: 14px;
        padding-right: 14px;
        gap: 34px;
      }

      .topbar {
        min-height: 52px;
      }

      .brand img {
        width: 36px;
        height: 36px;
      }

      .trip-link {
        min-height: 68px;
        padding: 14px 14px 14px 16px;
        gap: 12px;
      }

      .arrow {
        width: 38px;
        height: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Coco Travel 首页">
        <img src="./assets/icon-192.png" alt="" width="38" height="38" />
        <span>Coco Travel</span>
      </a>
    </header>

    <section class="home" aria-labelledby="current-title">
      <p class="label" id="current-title">即将进行或正在进行</p>
      <a class="trip-link" href="./jeju_olle_itinerary_2026-09-20_to_2026-09-30.html" aria-label="打开 2026-09 济州岛行程">
        <span class="trip-name">2026-09 济州岛</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </section>
  </main>
</body>
</html>
