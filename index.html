<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Coco Travel 当前行程与全部行程入口。" />
  <meta name="theme-color" content="#0076c9" />
  <title>Coco Travel</title>
  <link rel="icon" href="./assets/favicon.ico" sizes="any" />
  <link rel="icon" href="./assets/coco-travel-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <style>
    :root {
      --bg: #f5f9fb;
      --surface: #fbfefd;
      --surface-strong: #edf6fa;
      --text: #20303a;
      --muted: #60717b;
      --line: #d7e5eb;
      --line-strong: #b8d1dc;
      --accent: #0076c9;
      --accent-strong: #005891;
      --accent-soft: #e5f4ff;
      --warm: #f28c18;
      --warm-soft: #fff2df;
      --shadow: 0 14px 34px rgba(21, 57, 77, .10);
      --radius: 18px;
      --radius-sm: 12px;
      color-scheme: light dark;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a20;
        --surface: #17242b;
        --surface-strong: #1f313b;
        --text: #edf7fb;
        --muted: #afc2cb;
        --line: #2a424e;
        --line-strong: #3d5a68;
        --accent: #5db9f3;
        --accent-strong: #94d4ff;
        --accent-soft: #143140;
        --warm: #ffb257;
        --warm-soft: #3a2714;
        --shadow: 0 14px 34px rgba(0, 0, 0, .24);
      }
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    ::selection {
      color: #f7fbfd;
      background: var(--accent-strong);
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--warm) 72%, transparent);
      outline-offset: 4px;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 26rem),
        radial-gradient(circle at 94% 6%, color-mix(in srgb, var(--warm) 16%, transparent), transparent 22rem),
        linear-gradient(180deg, var(--bg), var(--surface-strong));
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: 0;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .page {
      width: min(100%, 1120px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) clamp(16px, 5vw, 32px) max(28px, env(safe-area-inset-bottom));
      display: grid;
      align-content: start;
      gap: 18px;
    }

    .topbar {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 860;
    }

    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .nav-link {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 13px;
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      color: var(--muted);
      font-size: .88rem;
      font-weight: 760;
    }

    .current {
      display: grid;
      gap: 10px;
      margin-top: 8px;
      width: min(100%, 760px);
    }

    .section-title {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 780;
    }

    .current-link {
      position: relative;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 15px 16px 15px 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .current-link::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: linear-gradient(180deg, var(--accent), var(--warm));
    }

    .current-link:hover,
    .trip-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 34%, var(--line));
      box-shadow: 0 18px 42px rgba(21, 57, 77, .14);
    }

    .current-link:active,
    .trip-card:active {
      transform: scale(.985);
    }

    .current-name {
      min-width: 0;
      padding-left: 4px;
      font-size: clamp(1.35rem, 7vw, 2.35rem);
      line-height: 1.06;
      font-weight: 920;
    }

    .arrow {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #f7fbfd;
      background: var(--accent-strong);
      font-size: 1.35rem;
      line-height: 1;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      margin-top: 8px;
      width: min(100%, 760px);
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .search-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 7px 0 14px;
      background: var(--surface);
    }

    .search-wrap input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
    }

    .search-wrap input::placeholder {
      color: color-mix(in srgb, var(--muted) 78%, transparent);
    }

    .clear-btn {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 999px;
      display: none;
      place-items: center;
      color: var(--muted);
      background: var(--surface-strong);
      cursor: pointer;
    }

    .clear-btn.show { display: grid; }

    .all-trips {
      display: grid;
      gap: 10px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.2;
    }

    .result-copy {
      margin: 0;
      color: var(--muted);
      font-size: .86rem;
      font-weight: 720;
    }

    .trip-list {
      display: grid;
      gap: 12px;
    }

    .trip-card {
      position: relative;
      display: grid;
      grid-template-columns: 132px 1fr;
      align-items: stretch;
      gap: 14px;
      min-height: 160px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .trip-thumb {
      min-height: 136px;
      border-radius: 14px;
      background: var(--surface-strong) center / cover no-repeat;
      overflow: hidden;
    }

    .trip-main {
      min-width: 0;
      display: grid;
      align-content: space-between;
      gap: 14px;
      padding: 2px 2px 2px 0;
    }

    .trip-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .trip-title {
      min-width: 0;
    }

    .trip-title h3 {
      margin: 0;
      font-size: clamp(1.35rem, 4.2vw, 1.75rem);
      line-height: 1.16;
      letter-spacing: 0;
    }

    .trip-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .94rem;
      line-height: 1.4;
    }

    .status {
      flex: 0 0 auto;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 0 10px;
      background: color-mix(in srgb, #2f8a5b 18%, transparent);
      color: color-mix(in srgb, #2f8a5b 82%, var(--text));
      font-size: .78rem;
      font-weight: 860;
      white-space: nowrap;
    }

    .status.draft {
      background: var(--warm-soft);
      color: color-mix(in srgb, var(--warm) 74%, var(--text));
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .meta {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      border-radius: 12px;
      padding: 7px 9px;
      background: var(--surface-strong);
      color: var(--muted);
      font-size: .84rem;
      font-weight: 720;
    }

    .meta-icon {
      color: var(--accent-strong);
      font-size: 1.08rem;
    }

    .tag-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .tag {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 9px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: .78rem;
      font-weight: 820;
      white-space: nowrap;
    }

    .tag.warm {
      background: var(--warm-soft);
      color: color-mix(in srgb, var(--warm) 70%, var(--text));
    }

    .trip-card strong {
      display: block;
      font-size: inherit;
      line-height: 1.25;
    }

    .empty {
      display: none;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 18px 14px;
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      color: var(--muted);
      text-align: center;
      font-size: .92rem;
    }

    .empty.show { display: block; }

    @media (max-width: 760px) {
      .trip-card {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .trip-thumb {
        aspect-ratio: 16 / 9;
        min-height: 0;
      }

      .trip-title-row {
        display: grid;
      }

      .status {
        width: fit-content;
      }

      .meta-grid {
        grid-template-columns: 1fr;
      }

      .meta {
        min-height: 46px;
      }
    }

    @media (max-width: 430px) {
      body { font-size: 15px; }

      .page {
        padding-left: 14px;
        padding-right: 14px;
        gap: 16px;
      }

      .topbar {
        min-height: 52px;
      }

      .brand img {
        width: 36px;
        height: 36px;
      }

      .nav-link {
        display: none;
      }

      .current-link {
        min-height: 66px;
        padding: 14px;
      }

      .arrow {
        width: 38px;
        height: 38px;
      }

      .section-head {
        display: grid;
        gap: 3px;
      }

      .trip-title h3 {
        font-size: clamp(1.25rem, 8vw, 1.65rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Coco Travel 首页">
        <img src="./assets/icon-192.png" alt="" width="38" height="38" />
        <span>Coco Travel</span>
      </a>
      <a class="nav-link" href="#all-trips">全部行程</a>
    </header>

    <section class="current" aria-labelledby="current-title">
      <p class="section-title" id="current-title">即将进行或正在进行</p>
      <a class="current-link" href="./jeju_olle_itinerary_2026-09-20_to_2026-09-30.html" aria-label="打开 2026-09 济州岛行程">
        <span class="current-name">2026-09 济州岛</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </section>

    <section class="toolbar" aria-label="行程搜索">
      <label class="search-wrap" for="trip-search">
        <input id="trip-search" type="search" autocomplete="off" placeholder="搜索地点、月份、主题，例如 济州、2026-09、徒步" />
        <button class="clear-btn" id="clear-search" type="button" aria-label="清空搜索">×</button>
      </label>
    </section>

    <section class="all-trips" id="all-trips" aria-labelledby="all-title">
      <div class="section-head">
        <h2 id="all-title">全部行程</h2>
        <p class="result-copy" id="result-copy">目前收录 2 个行程</p>
      </div>
      <div class="trip-list" id="trip-list"></div>
      <div class="empty" id="empty-state" aria-live="polite">没有找到匹配行程，换个关键词试试。</div>
    </section>
  </main>

  <script>
    const trips = [
      {
        name: "2026-09 济州岛",
        summary: "西归浦、城山、济州市三段移动，覆盖 Olle 6、7、8、10、1、1-1。",
        dates: "2026-09-20 至 2026-09-30",
        duration: "11 天",
        focus: "Olle 徒步",
        status: "已完成规划",
        statusType: "",
        statusIcon: "ph-check-circle",
        href: "./jeju_olle_itinerary_2026-09-20_to_2026-09-30.html",
        image: "./assets/jeju-olle-cover.png",
        tags: ["Jeju Olle", "Solo Trip", "徒步", "购物", "地图"],
        searchable: "2026-09 济州岛 韩国 济州 Jeju Olle Solo Trip 徒步 购物 地图 西归浦 城山 济州市"
      },
      {
        name: "2027-02 澳洲",
        summary: "Melbourne + Tasmania 双人旅行，保留 Plan A / B；塔州全程自驾，沿海小镇慢停与民宿自炊。",
        dates: "2027-02-16 至 2027-03-03",
        duration: "16 天",
        focus: "Melbourne + Tasmania",
        status: "备选规划",
        statusType: "draft",
        statusIcon: "ph-compass",
        href: "./australia_melbourne_tasmania_2027.html",
        image: "./assets/australia-tasmania-cover.png",
        tags: ["Australia", "Tasmania", "Road Trip", "Plan A/B", "双人旅行"],
        searchable: "2027-02 澳洲 澳大利亚 Australia Melbourne Tasmania Hobart Freycinet Bay of Fires Launceston Cradle Mountain Great Ocean Road 自驾 塔斯马尼亚 墨尔本"
      }
    ];

    const list = document.querySelector("#trip-list");
    const search = document.querySelector("#trip-search");
    const clear = document.querySelector("#clear-search");
    const empty = document.querySelector("#empty-state");
    const resultCopy = document.querySelector("#result-copy");

    function renderTrips(query = "") {
      const normalized = query.trim().toLowerCase();
      const filtered = trips.filter((trip) => {
        if (!normalized) return true;
        return trip.searchable.toLowerCase().includes(normalized);
      });

      list.innerHTML = filtered.map((trip) => {
        const tags = trip.tags.map((tag, index) => `<span class="tag ${index === 0 ? "warm" : ""}">${tag}</span>`).join("");
        return `
        <a class="trip-card" href="${trip.href}" data-search="${trip.searchable.toLowerCase()}">
          <div class="trip-thumb" style="background-image: url('${trip.image}');" role="img" aria-label="${trip.name} 风景"></div>
          <div class="trip-main">
            <div class="trip-title-row">
              <div class="trip-title">
                <h3>${trip.name}</h3>
                <p>${trip.summary}</p>
              </div>
              <span class="status ${trip.statusType || ""}"><i class="ph ${trip.statusIcon || "ph-check-circle"}" aria-hidden="true"></i>${trip.status}</span>
            </div>
            <div class="meta-grid" aria-label="${trip.name} 信息">
              <span class="meta"><i class="ph ph-calendar-dots meta-icon" aria-hidden="true"></i>${trip.dates}</span>
              <span class="meta"><i class="ph ph-clock meta-icon" aria-hidden="true"></i>${trip.duration}</span>
              <span class="meta"><i class="ph ph-person-simple-hike meta-icon" aria-hidden="true"></i>${trip.focus}</span>
            </div>
            <div class="tag-row">${tags}</div>
          </div>
        </a>
      `;
      }).join("");

      empty.classList.toggle("show", filtered.length === 0);
      clear.classList.toggle("show", normalized.length > 0);

      if (normalized && filtered.length) {
        resultCopy.textContent = `找到 ${filtered.length} 个匹配行程`;
      } else if (normalized) {
        resultCopy.textContent = "没有匹配行程";
      } else {
        resultCopy.textContent = `目前收录 ${trips.length} 个行程`;
      }
    }

    search.addEventListener("input", (event) => renderTrips(event.target.value));
    clear.addEventListener("click", () => {
      search.value = "";
      search.focus();
      renderTrips("");
    });

    renderTrips();
  </script>
</body>
</html>
